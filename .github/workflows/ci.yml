name: Recipe Event Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        
      - name: TypeScript type checking
        run: npm run build

      - name: Run test
        run: npm test

      - name: Synthesize AWS infrastructure
        run: npm run synth -- RecipeEventLabStack > /dev/null
